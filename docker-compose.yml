services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zyznjc
      POSTGRES_USER: zyznjc
      POSTGRES_PASSWORD: zyznjc_dev
    ports:
      - "55432:5432"
    volumes:
      - zyznjc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyznjc -d zyznjc"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zyznjc_pgdata:
